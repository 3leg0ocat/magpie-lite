# magpie-lite's Windows x64 exe (build/lite), built when run by hand and
# kept as the run's artifact.
name: lite build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lite checks
        shell: bash
        run: go test ./internal/update ./internal/provider -run '^(TestOff|TestTrimmed)' -count=1
      - name: Package
        shell: bash
        run: build/lite/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: magpie-lite-windows-x64
          path: dist/magpie-lite-*
